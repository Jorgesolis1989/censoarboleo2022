<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <script src="https://kit.fontawesome.com/ab00d86059.js" crossorigin="anonymous"></script>
      <img class="wave" src="https://raw.githubusercontent.com/Jhonierpc/WebDevelopment/master/Login%20Responsive/img/wave.png" alt="">
      <div class="container">
          <div class="img">
             <img src="img/funa.png" alt="">
          </div>
          <div class="login-container">
              <form action="index.html">
                 
                  <h2>Bienvenido</h2>
                  <div class="input-div one">
                      <div class="i">
                          <i class="fas fa-user"></i>
                      </div>
                      <div>
                          <h5>Usuario</h5>
                          <input class="input" type="text">
                      </div>
                  </div>
                  <div class="input-div two">
                      <div class="i">
                          <i class="fas fa-lock"></i>
                      </div>
                      <div>
                          <h5>Contraseña</h5>
                          <input class="input" type="password">
                      </div>
                  </div>
                  <a href="#">¿ólvido su contraseña?</a>
                  <input class="btn" type="submit" value="Ingresar">
              </form>
          </div>
      </div>
      <script type="text/javascript" src="js/main.js"></script>
  </body>
<script src="js/login.js"></script>
</html>
